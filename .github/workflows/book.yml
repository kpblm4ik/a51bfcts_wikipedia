name: Deploy Markdown Site
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Проверка репозитория
        uses: actions/checkout@v4

      - name: Установка Pandoc
        run: sudo apt-get install -y pandoc

      - name: Сборка главной страницы из Markdown в HTML
        run: |
          mkdir -p public
          # Превращаем ваш SUMMARY.md (или README.md) в главную страницу index.html
          # и жестко вшиваем туда ваш custom.css
          pandoc SUMMARY.md -s -c custom.css -o public/index.html
          
          # Копируем стили и картинку в готовую папку сайта
          cp custom.css public/
          cp Screenshot_20261006_110338.jpg public/ 2>/dev/null || true

      - name: Публикация на GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
