name: Deploy Rust mdBook
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Проверка репозитория
        uses: actions/checkout@v4

      - name: Установка Rust mdBook
        run: |
          mkdir -p bin
          curl -sSL https://github.com | tar -xz -C bin
          echo "$GITHUB_WORKSPACE/bin" >> $GITHUB_PATH

      - name: Чистая сборка книги через Rust
        run: mdbook build

      - name: Публикация на GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./book
