name: Build ECM WebAssembly (experimental)

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Опубликовать собранный движок в js/ecm/ на сайте (после успешного smoke-теста)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.64'

      - name: Build and smoke-test
        shell: bash
        run: |
          mkdir -p ecm-logs
          set -o pipefail

          python3 tools/ecm/build.py 2>&1 | tee ecm-logs/build.log
          node tools/ecm/smoke.cjs 2>&1 | tee ecm-logs/smoke.log

      - name: Save diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecm-build-logs
          path: |
            ecm-logs/
            .ecm-work/build/CMakeCache.txt
            .ecm-work/build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn

      - name: Save tested package
        uses: actions/upload-artifact@v4
        with:
          name: ecm-wasm-experimental
          path: ecm-dist/
          if-no-files-found: error

      # Только если при запуске включена галочка publish и сборка с тестом прошли.
      # Кладёт движок в js/ecm/ (там его ищет опасная зона). В git попадает ~50 МБ бинарников
      # на каждую публикацию, поэтому включайте галочку только когда нужно обновить движок.
      - name: Publish engine to site
        if: ${{ inputs.publish }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p js/ecm
          cp ecm-dist/js/ecm/* js/ecm/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/ecm
          if git diff --cached --quiet; then
            echo "Nothing new to publish."
          else
            git commit -m "ECM wasm engine (built by workflow)"
            git push origin HEAD:${{ github.ref_name }}
          fi
