<!-- Стили для аккуратной кнопки и линзы лупы -->
<style>
  /* Фиксированная кнопка в правом нижнем углу */
  #magnifier-toggle-btn {
    position: fixed;
    right: 20px;
    bottom: 90px; /* Чуть выше кнопки "Вверх", чтобы не перекрывать */
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: #1a1a1a;
    border: 2px solid #00ffcc; /* Твой неоновый стиль */
    color: #00ffcc;
    box-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
    cursor: pointer;
    z-index: 99999;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
  }
  #magnifier-toggle-btn.active {
    background: #00ffcc;
    color: #1a1a1a;
    box-shadow: 0 0 20px #00ffcc;
  }
  #magnifier-toggle-btn svg {
    width: 24px;
    height: 24px;
  }

  /* Окно самой лупы (линза) */
  #screen-magnifier-lens {
    position: fixed;
    width: 200px;
    height: 200px;
    border: 3px solid #00ffcc;
    border-radius: 12px; /* Аккуратный скругленный прямоугольник */
    box-shadow: 0 0 20px rgba(0,0,0,0.8), inset 0 0 10px rgba(0,255,204,0.3);
    z-index: 99998;
    cursor: move;
    overflow: hidden;
    pointer-events: none; /* Чтобы можно было кликать сквозь неё на элементы сайта */
    display: none;
    background: #0d0d0d;
  }

  /* Контент внутри линзы */
  #lens-content {
    position: absolute;
    top: 0;
    left: 0;
    transform-origin: 0 0;
  }
</style>

<!-- Кнопка-иконка -->
<button id="magnifier-toggle-btn" title="Экранная лупа">
  <svg viewBox="0 0 24 24">
    <path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
  </svg>
</button>

<!-- Линза лупы -->
<div id="screen-magnifier-lens">
  <div id="lens-content"></div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const btn = document.getElementById("magnifier-toggle-btn");
    const lens = document.getElementById("screen-magnifier-lens");
    const lensContent = document.getElementById("lens-content");
    const wrapper = document.querySelector(".wrapper");
    
    if (!btn || !lens || !wrapper) return;

    const ZOOM = 2; // Кратность увеличения (х2)
    let isActive = false;

    // Функция обновления того, что отображается внутри линзы
    function syncLens(e) {
        if (!isActive) return;

        // Определяем координаты центра линзы (либо по мыши, либо по тачу)
        let clientX = e.clientX || (e.touches && e.touches[0].clientX);
        let clientY = e.clientY || (e.touches && e.touches[0].clientY);

        if (clientX === undefined || clientY === undefined) return;

        // Центрируем прямоугольник лупы относительно пальца/курсора
        const lensWidth = lens.offsetWidth;
        const lensHeight = lens.offsetHeight;
        
        let lensX = clientX - lensWidth / 2;
        let lensY = clientY - lensHeight / 2;

        // Не даем лупе вылетать за границы экрана
        lensX = Math.max(0, Math.min(window.innerWidth - lensWidth, lensX));
        lensY = Math.max(0, Math.min(window.innerHeight - lensHeight, lensY));

        lens.style.left = `${lensX}px`;
        lens.style.top = `${lensY}px`;

        // Рассчитываем точный сдвиг увеличенного фона
        // Линза должна показывать строго то, что находится ПОД ней
        const scrollX = window.scrollX || window.pageXOffset;
        const scrollY = window.scrollY || window.pageYOffset;

        const targetX = -(lensX + scrollX) * ZOOM + (lensWidth / 2) * (ZOOM - 1);
        const targetY = -(lensY + scrollY) * ZOOM + (lensHeight / 2) * (ZOOM - 1);

        lensContent.style.transform = `translate3d(${targetX / ZOOM}px, ${targetY / ZOOM}px, 0) scale(${ZOOM})`;
    }

    function initLensContent() {
        // Копируем только структуру враппера без рекурсии кнопок
        const clone = wrapper.cloneNode(true);
        clone.querySelector("#magnifier-toggle-btn")?.remove();
        clone.querySelector("#screen-magnifier-lens")?.remove();
        
        // Фиксируем размеры клона один в один как у оригинала страницы
        clone.style.width = wrapper.offsetWidth + "px";
        clone.style.minWidth = wrapper.offsetWidth + "px";
        clone.style.maxWidth = "none";
        clone.style.margin = "0";
        clone.style.position = "absolute";
        clone.style.top = "0";
        clone.style.left = "0";

        lensContent.innerHTML = '';
        lensContent.appendChild(clone);
    }

    btn.addEventListener("click", () => {
        isActive = !isActive;
        if (isActive) {
            btn.classList.add("active");
            lens.style.display = "block";
            initLensContent();
            
            // Центрируем лупу при включении
            lens.style.left = `${window.innerWidth / 2 - 100}px`;
            lens.style.top = `${window.innerHeight / 2 - 100}px`;
        } else {
            btn.classList.remove("active");
            lens.style.display = "none";
            lensContent.innerHTML = '';
        }
    });

    // Отслеживание перемещения на ПК и мобилках
    window.addEventListener("mousemove", syncLens);
    window.addEventListener("touchmove", syncLens, { passive: true });
    window.addEventListener("scroll", () => {
        if (isActive) requestAnimationFrame(() => syncLens({ clientX: lens.offsetLeft + 100, clientY: lens.offsetTop + 100 }));
    });
});
</script>
