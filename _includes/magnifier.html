<!-- Фиолетовые неоновые стили и элементы управления -->
<style>
  /* Фиксированная кнопка включения лупы в углу */
  #magnifier-toggle-btn {
    position: fixed;
    right: 20px;
    bottom: 90px;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: #0b090f;
    border: 2px solid #a066ff; /* Фиолетовый неон твоей Вики */
    color: #a066ff;
    box-shadow: 0 0 10px rgba(160, 102, 255, 0.4);
    cursor: pointer;
    z-index: 99999;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
  }
  #magnifier-toggle-btn.active {
    background: #a066ff;
    color: #0b090f;
    box-shadow: 0 0 20px #a066ff;
  }
  #magnifier-toggle-btn svg {
    width: 24px;
    height: 24px;
  }

  /* Само перетаскиваемое и ресайзимое окно лупы */
  #screen-magnifier-lens {
    position: fixed;
    border: 3px solid #a066ff;
    border-radius: 12px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.9), inset 0 0 15px rgba(160,102,255,0.2);
    z-index: 99998;
    overflow: hidden;
    display: none;
    background: #050407;
    touch-action: none; /* Запрещает скроллить саму страницу при движении лупы */
  }

  /* Шапка лупы для стабильного перетаскивания (Драг) */
  #lens-drag-handle {
    width: 100%;
    height: 28px;
    background: rgba(160, 102, 255, 0.15);
    border-bottom: 1px solid rgba(160, 102, 255, 0.3);
    cursor: move;
    display: flex;
    align-items: center;
    padding-left: 10px;
    font-size: 11px;
    color: #e2daf0;
    font-family: monospace;
    user-select: none;
  }

  /* Область вывода (Визуальный изолятор) */
  #lens-viewer {
    width: 100%;
    height: calc(100% - 28px);
    position: relative;
    overflow: hidden;
  }

  /* Зеркало контента внутри линзы */
  #lens-mirror {
    position: absolute;
    top: 0;
    left: 0;
    transform-origin: 0 0;
  }

  /* Уголок для изменения размеров окна лупы (Ресайз) */
  #lens-resize-handle {
    position: absolute;
    right: 0;
    bottom: 0;
    width: 18px;
    height: 18px;
    cursor: se-resize;
    background: linear-gradient(135deg, transparent 50%, #a066ff 50%);
    border-radius: 0 0 9px 0;
    z-index: 100000;
  }
</style>

<!-- Кнопка-иконка -->
<button id="magnifier-toggle-btn" title="Включить лупу для поиска пасхалок">
  <svg viewBox="0 0 24 24">
    <path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
  </svg>
</button>

<!-- Конструкция лупы -->
<div id="screen-magnifier-lens">
  <div id="lens-drag-handle">LENS // X2 ZOOM</div>
  <div id="lens-viewer">
    <div id="lens-mirror"></div>
  </div>
  <div id="lens-resize-handle"></div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const btn = document.getElementById("magnifier-toggle-btn");
    const lens = document.getElementById("screen-magnifier-lens");
    const mirror = document.getElementById("lens-mirror");
    const dragHandle = document.getElementById("lens-drag-handle");
    const resizeHandle = document.getElementById("lens-resize-handle");
    
    const ZOOM = 2; // Кратность увеличения х2
    
    let state = {
        visible: false,
        x: window.innerWidth / 2 - 125,
        y: window.innerHeight / 2 - 125,
        w: 250,
        h: 250
    };

    // Честное динамическое обновление позиции БЕЗ багов рекурсии
    function updateMirrorView() {
        if (!state.visible) return;

        const scrollX = window.scrollX || window.pageXOffset;
        const scrollY = window.scrollY || window.pageYOffset;

        // Рассчитываем положение линзы относительно документа
        const lensDocX = state.x + scrollX;
        const lensDocY = state.y + 28 + scrollY; // 28px - высота шапки

        // Движение зеркала строго в противоход движению окна лупы
        const tx = -lensDocX;
        const ty = -lensDocY;

        mirror.style.transform = `scale(${ZOOM}) translate3d(${tx}px, ${ty}px, 0)`;
    }

    function initLensView() {
        const wrapper = document.querySelector(".wrapper");
        if (wrapper) {
            // Клонируем только текстовый контент/картинки, принудительно обрезая саму лупу
            const clone = wrapper.cloneNode(true);
            clone.querySelector("#magnifier-toggle-btn")?.remove();
            clone.querySelector("#screen-magnifier-lens")?.remove();
            
            // Жестко фиксируем сетку клона под размеры оригинального сайта
            clone.style.width = wrapper.offsetWidth + "px";
            clone.style.minWidth = wrapper.offsetWidth + "px";
            clone.style.maxWidth = "none";
            clone.style.margin = "0";
            
            mirror.innerHTML = '';
            mirror.appendChild(clone);
        }
    }

    function applyState() {
        lens.style.transform = `translate3d(${state.x}px, ${state.y}px, 0)`;
        lens.style.width = `${state.w}px`;
        lens.style.height = `${state.h}px`;

        if (state.visible) {
            lens.style.display = "block";
            btn.classList.add("active");
            initLensView();
            requestAnimationFrame(updateMirrorView);
        } else {
            lens.style.display = "none";
            btn.classList.remove("active");
            mirror.innerHTML = '';
        }
    }

    btn.addEventListener("click", () => {
        state.visible = !state.visible;
        applyState();
    });

    // Синхронизация при прокрутке экрана
    window.addEventListener("scroll", () => {
        if (state.visible) requestAnimationFrame(updateMirrorView);
    }, { passive: true });

    // --- Логика перетаскивания и изменения размеров ---
    let activeAction = null;
    let startPointerX, startPointerY;
    let startX, startY, startW, startH;

    function startAction(type, clientX, clientY) {
        activeAction = type;
        startPointerX = clientX;
        startPointerY = clientY;
        startX = state.x;
        startY = state.y;
        startW = state.w;
        startH = state.h;
        document.body.style.userSelect = "none";
    }

    // Поддержка ПК мыши
    dragHandle.addEventListener("mousedown", (e) => startAction('drag', e.clientX, e.clientY));
    resizeHandle.addEventListener("mousedown", (e) => startAction('resize', e.clientX, e.clientY));
    
    // Идеальная поддержка Тач-событий мобильных устройств
    dragHandle.addEventListener("touchstart", (e) => {
        if (e.touches.length > 0) startAction('drag', e.touches[0].clientX, e.touches[0].clientY);
    });
    resizeHandle.addEventListener("touchstart", (e) => {
        if (e.touches.length > 0) startAction('resize', e.touches[0].clientX, e.touches[0].clientY);
    });

    function moveAction(clientX, clientY) {
        if (!activeAction) return;

        const deltaX = clientX - startPointerX;
        const deltaY = clientY - startPointerY;

        if (activeAction === 'drag') {
            state.x = Math.max(0, Math.min(window.innerWidth - state.w, startX + deltaX));
            state.y = Math.max(0, Math.min(window.innerHeight - state.h, startY + deltaY));
            lens.style.transform = `translate3d(${state.x}px, ${state.y}px, 0)`;
        } else if (activeAction === 'resize') {
            state.w = Math.max(140, Math.min(window.innerWidth - state.x, startW + deltaX));
            state.h = Math.max(140, Math.min(window.innerHeight - state.y, startH + deltaY));
            lens.style.width = `${state.w}px`;
            lens.style.height = `${state.h}px`;
        }

        requestAnimationFrame(updateMirrorView);
    }

    window.addEventListener("mousemove", (e) => moveAction(e.clientX, e.clientY));
    window.addEventListener("touchmove", (e) => {
        if (activeAction && e.touches.length > 0) {
            moveAction(e.touches[0].clientX, e.touches[0].clientY);
        }
    }, { passive: false });

    const endAction = () => {
        activeAction = null;
        document.body.style.userSelect = "";
    };
    window.addEventListener("mouseup", endAction);
    window.addEventListener("touchend", endAction);
});
</script>
