<!-- Стили для адаптивного увеличения строк без наложения -->
<style>
  /* Фиксированная фиолетовая кнопка "Аа" в углу */
  #text-zoom-btn {
    position: fixed;
    right: 20px;
    bottom: 90px;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: #0b090f;
    border: 2px solid #a066ff;
    color: #a066ff;
    box-shadow: 0 0 10px rgba(160, 102, 255, 0.4);
    cursor: pointer;
    z-index: 999999;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: sans-serif;
    font-weight: bold;
    font-size: 18px;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    -webkit-tap-highlight-color: transparent;
  }
  #text-zoom-btn.active {
    background: #a066ff;
    color: #0b090f;
    box-shadow: 0 0 20px #a066ff;
  }

  /* Всплывающая подсказка слева от кнопки */
  #text-zoom-tooltip {
    position: fixed;
    right: 80px;
    bottom: 100px;
    background: #0b090f;
    border: 1px solid #a066ff;
    color: #e2daf0;
    padding: 8px 14px;
    border-radius: 6px;
    font-size: 12px;
    font-family: monospace;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
    z-index: 999999;
    pointer-events: none;
    opacity: 0;
    transform: translate3d(20px, 0, 0);
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    white-space: nowrap;
  }
  #text-zoom-tooltip.show {
    opacity: 1;
    transform: translate3d(0, 0, 0);
  }

  /* Режим инспектора текста: включаем плавную анимацию для свойств размера */
  body.text-zoom-mode .wrapper p,
  body.text-zoom-mode .wrapper h1,
  body.text-zoom-mode .wrapper h4 {
    cursor: zoom-in;
    /* Анимируем fontSize и lineHeight вместо transform, чтобы соседние блоки раздвигались */
    transition: font-size 0.3s cubic-bezier(0.4, 0, 0.2, 1), 
                line-height 0.3s cubic-bezier(0.4, 0, 0.2, 1), 
                text-shadow 0.3s ease, 
                color 0.3s ease !important;
  }

  /* Эффект честного увеличения строки в 3 раза за счет размера шрифта */
  body.text-zoom-mode .wrapper p.zoomed-active {
    font-size: 48px !important; /* Увеличиваем базовый текст (обычно 16px) ровно в 3 раза */
    line-height: 1.2 !important;
    text-shadow: 0 0 15px #a066ff, 0 0 5px rgba(160, 102, 255, 0.5) !important;
    color: #ffffff !important;
  }

  body.text-zoom-mode .wrapper h1.zoomed-active,
  body.text-zoom-mode .wrapper h4.zoomed-active {
    font-size: 56px !important; /* Корректировка для заголовков */
    line-height: 1.2 !important;
    text-shadow: 0 0 15px #a066ff, 0 0 5px rgba(160, 102, 255, 0.5) !important;
    color: #ffffff !important;
  }
</style>

<!-- Кнопка Аа -->
<button id="text-zoom-btn">Аа</button>

<!-- Подсказка -->
<div id="text-zoom-tooltip">Удержите палец на строке, чтобы увеличить её</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const btn = document.getElementById("text-zoom-btn");
    const tooltip = document.getElementById("text-zoom-tooltip");
    let isModeActive = false;

    btn.addEventListener("click", (e) => {
        e.preventDefault();
        isModeActive = !isModeActive;
        
        if (isModeActive) {
            btn.classList.add("active");
            document.body.classList.add("text-zoom-mode");
            tooltip.classList.add("show");
            setTimeout(() => {
                tooltip.classList.remove("show");
            }, 4000);
        } else {
            btn.classList.remove("active");
            document.body.classList.remove("text-zoom-mode");
            tooltip.classList.remove("show");
            document.querySelectorAll(".zoomed-active").forEach(el => el.classList.remove("zoomed-active"));
        }
    });

    function zoomIn(element) {
        if (!isModeActive) return;
        element.classList.add("zoomed-active");
    }

    function zoomOut(element) {
        element.classList.remove("zoomed-active");
    }

    const textElements = document.querySelectorAll(".wrapper p, .wrapper h1, .wrapper h4");

    textElements.forEach(el => {
        // Поддержка мобильных тач-скринов
        el.addEventListener("touchstart", () => zoomIn(el), { passive: true });
        el.addEventListener("touchend", () => zoomOut(el), { passive: true });
        el.addEventListener("touchcancel", () => zoomOut(el), { passive: true });

        // Поддержка мыши на ПК
        el.addEventListener("mousedown", () => zoomIn(el));
        el.addEventListener("mouseup", () => zoomOut(el));
        el.addEventListener("mouseleave", () => zoomOut(el));
    });
});
</script>
