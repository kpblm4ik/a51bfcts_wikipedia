<!-- Стиль лупы: вся магия увеличения происходит в CSS -->
<style>
#super-simple-lens {
  position: fixed;
  width: 200px;
  height: 150px;
  border: 3px solid #a066ff; /* Ваш фиолетовый неон */
  box-shadow: 0 0 20px rgba(160, 102, 255, 0.5);
  border-radius: 8px;
  pointer-events: none; /* Лупа «прозрачна» для кликов, можно нажимать на ссылки сквозь неё */
  display: none;
  z-index: 99999;
  
  /* Аппаратное увеличение всего, что находится под блоком */
  backdrop-filter: blur(0px) scale(2); 
  -webkit-backdrop-filter: blur(0px) scale(2);
}
</style>

<!-- Элемент лупы -->
<div id="super-simple-lens"></div>

<!-- Скрипт, который просто двигает её за курсором -->
<script>
document.addEventListener('DOMContentLoaded', () => {
  const lens = document.getElementById('super-simple-lens');
  
  // Показываем лупу при движении мыши и прячем, если курсор ушел
  document.addEventListener('mousemove', (e) => {
    lens.style.display = 'block';
    // Центрируем прямоугольник по курсору
    lens.style.left = (e.clientX - 100) + 'px';
    lens.style.top = (e.clientY - 75) + 'px';
  });

  document.addEventListener('mouseleave', () => {
    lens.style.display = 'none';
  });
});
</script>
