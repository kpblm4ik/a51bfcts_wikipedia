<!-- Главный контейнер виджета в правом нижнем углу -->
<div id="neo-corner-widget">
  
  <!-- Основная круглая кнопка-триггер (теперь первая в коде для правильной работы Flexbox) -->
  <button id="widget-trigger-btn" title="Открыть меню">Ξ</button>

  <!-- Вылетающая вверх «колбаска» с кнопками -->
  <div id="neo-panel-widget">
    <!-- Текст статуса для инспектора (нужен для JS) -->
    <div class="widget-status">СТАНДАРТ</div>
    
    <!-- Кнопка инспектора текста -->
    <button id="widget-zoom-btn" title="Режим инспектора текста">Aa</button>

    <!-- Кнопка поиска -->
    <button id="widget-search-btn" title="Поиск по Вики">⌕</button>
  </div>
</div>

<style>
/* Общий контейнер, который теперь контролирует положение и рост меню снизу вверх */
#neo-corner-widget {
  position: fixed;
  right: 20px;
  bottom: 20px;
  display: flex;
  flex-direction: column-reverse; /* Разворачивает элементы: триггер снизу, панель растет вверх */
  align-items: center;
  gap: 15px; /* Задает точный отступ между круглой кнопкой и выезжающей панелью */
  z-index: 9999999 !important;
}

/* Круглая фиксированная кнопка */
#widget-trigger-btn {
  position: relative; /* Убрали fixed, так как родитель уже зафиксирован */
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: #0b090f;
  border: 2px solid #a066ff;
  color: #a066ff;
  box-shadow: 0 0 12px rgba(160, 102, 255, 0.4);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: sans-serif;
  font-size: 22px;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  -webkit-tap-highlight-color: transparent;
}

/* Эффект при активации кнопки */
#widget-trigger-btn.active {
  background: #a066ff;
  color: #0b090f;
  box-shadow: 0 0 20px #a066ff;
  transform: rotate(90deg);
}

/* Вылетающая вверх панель-колбаска */
#neo-panel-widget {
  position: relative; /* Убрали fixed и жесткий bottom: 85px */
  width: 60px;
  background: rgba(11, 9, 15, 0.95);
  border: 1px solid rgba(160, 102, 255, 0.6);
  border-radius: 30px;
  padding: 15px 5px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  
  /* Эффект выезжания: точка трансформации теперь строго внизу панели */
  opacity: 0;
  filter: blur(10px);
  transform: translateY(30px) scale(0.5); /* Панель сжата и утоплена внутрь кнопки */
  transform-origin: bottom center; /* Анимация идет от нижней точки */
  pointer-events: none;
  transition: 
    opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1),
    filter 0.4s cubic-bezier(0.4, 0, 0.2, 1),
    transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 0 20px rgba(160, 102, 255, 0.3);
  backdrop-filter: blur(8px);
}

/* Класс активации панели */
#neo-panel-widget.show {
  opacity: 1;
  filter: blur(0px);
  transform: translateY(0) scale(1); /* Плавно вытягивается вверх */
  pointer-events: auto;
}

/* Мелкий текст статуса внутри панели */
.widget-status {
  font-family: monospace;
  font-size: 8px;
  color: #bcaada;
  text-align: center;
  letter-spacing: 0.5px;
  text-shadow: 0 0 4px rgba(188, 170, 218, 0.4);
  text-transform: uppercase;
  margin-bottom: 4px;
}

/* Кнопки внутри колбаски (Aa) */
#widget-zoom-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: #050407;
  border: 1px solid #a066ff;
  color: #a066ff;
  font-family: sans-serif;
  font-weight: bold;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.2s ease;
  box-shadow: 0 0 8px rgba(160, 102, 255, 0.2);
  -webkit-tap-highlight-color: transparent;
}

#widget-zoom-btn.active {
  background: #a066ff;
  color: #050407;
  box-shadow: 0 0 15px #a066ff;
}
  
/* Инспектор текста */
body.text-zoom-mode .wrapper h1,
body.text-zoom-mode .wrapper h2,
body.text-zoom-mode .wrapper h3,
body.text-zoom-mode .wrapper h4,
body.text-zoom-mode .wrapper p,
body.text-zoom-mode .wrapper li {
  cursor: pointer !important;
}

body.text-zoom-mode .wrapper .zoomed-active,
body.text-zoom-mode .wrapper * .zoomed-active,
body.text-zoom-mode .wrapper p.zoomed-active,
body.text-zoom-mode .wrapper h4.zoomed-active {
  font-size: 36px !important;
  line-height: 1.3 !important;
  color: #ffffff !important;
  text-shadow: 0 0 20px #a066ff, 0 0 8px rgba(160, 102, 255, 0.6) !important;
}

/* Стили Поиска (поправлен баг с пробелом в transition) */
#widget-search-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: #050407;
  border: 1px solid #a066ff;
  color: #a066ff;
  font-family: sans-serif;
  font-weight: bold;
  font-size: 18px;
  cursor: pointer;
  transition: all 0.2s ease; /* Убран лишний пробел */
  box-shadow: 0 0 8px rgba(160, 102, 255, 0.2);
  -webkit-tap-highlight-color: transparent;
}

#widget-search-btn:hover {
  background: rgba(160, 102, 255, 0.2);
  box-shadow: 0 0 12px #a066ff;
}
</style>
  
<script>
document.addEventListener("DOMContentLoaded", () => {
  const tBtn = document.getElementById("widget-trigger-btn");
  const pnl = document.getElementById("neo-panel-widget");
  if(tBtn && pnl) tBtn.onclick = (e) => { e.stopPropagation(); tBtn.classList.toggle("active"); pnl.classList.toggle("show"); };
  let zoomBtn = null;
  let statusText = null;
  let isZoomModeActive = false;

  // Безопасная инициализация: ищем элементы, даже если они загрузились позже
  function initZoom() {
    zoomBtn = document.getElementById("widget-zoom-btn");
    statusText = document.querySelector("#neo-panel-widget .widget-status");

    // Если кнопки еще нет на экране, пробуем снова через 100 миллисекунд
    if (!zoomBtn) {
      setTimeout(initZoom, 100);
      return;
    }

    // Как только нашли кнопку — вешаем на нее событие клика
    zoomBtn.addEventListener("click", (e) => {
      e.stopPropagation(); // Защита от закрытия колбасы
      toggleZoomMode();
    });
  }

  function toggleZoomMode() {
    isZoomModeActive = !isZoomModeActive;
    
    if (isZoomModeActive) {
      zoomBtn.classList.add("active");
      document.body.classList.add("text-zoom-mode");
      if (statusText) {
        statusText.textContent = "ИНСПЕКТОР";
        statusText.style.color = "#a066ff";
      }
    } else {
      zoomBtn.classList.remove("active");
      document.body.classList.remove("text-zoom-mode");
      if (statusText) {
        statusText.textContent = "СТАНДАРТ";
        statusText.style.color = "#bcaada";
      }
      document.querySelectorAll(".zoomed-active").forEach(el => el.classList.remove("zoomed-active"));
    }
  }

  // Логика клика по тексту (вешаем на весь документ, чтобы работало ВСЕГДА)
  document.addEventListener("click", (e) => {
    if (!isZoomModeActive) return;
    
    // Ищем, был ли клик по тексту внутри .wrapper
    const textEl = e.target.closest("p, h1, h2, h3, h4, h5, h6, li");
    
    // Дополнительная проверка, чтобы клик случайно не сработал на кнопках меню
    if (textEl && !e.target.closest("#neo-corner-widget")) {
      e.preventDefault();
      textEl.classList.toggle("zoomed-active");
    }
  });

  // Экспорт функции сброса для первого файла
  window.widgetResetZoom = () => {
    if (isZoomModeActive) toggleZoomMode();
  };

  // Запускаем поиск кнопки
  initZoom();
});
 </script>
