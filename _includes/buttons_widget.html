<!-- Главный контейнер виджета в правом нижнем углу -->
<div id="neo-corner-widget">
  
  <!-- Основная круглая кнопка-триггер (первая в коде для правильной работы Flexbox) -->
  <button id="widget-trigger-btn" title="Открыть меню">Ξ</button>

  <!-- Вылетающая вверх «колбаска» с кнопками -->
  <div id="neo-panel-widget">
    <!-- Текст статуса для инспектора (нужен для JS) -->
    <div class="widget-status">СТАНДАРТ</div>
    
    <!-- Кнопка инспектора текста -->
    <button id="widget-zoom-btn" title="Режим инспектора текста">Aa</button>

    <!-- Кнопка поиска -->
    <button id="widget-search-btn" title="Поиск по Вики">⌕</button>

    <!-- Экспериментальные функции: обычная ссылка, работает и без JS -->
    <a id="widget-experimental-btn" href="{{ '/experimental.html' | relative_url }}" title="Экспериментальные функции">⚗</a>

    <!-- Для разработчиков: токен, создание страниц, логи, заявки (js/dev.js грузится по клику) -->
    <button id="widget-dev-btn" title="Для разработчиков">&gt;_</button>
  </div>
</div>

<style>
/* Общий контейнер, который контролирует положение и рост меню снизу вверх */
#neo-corner-widget {
  position: fixed;
  right: 20px;
  bottom: 20px;
  display: flex;
  flex-direction: column-reverse; /* триггер снизу, панель растёт вверх */
  align-items: center;
  gap: 15px;
  z-index: 9999999 !important;
}

/* Круглая фиксированная кнопка */
#widget-trigger-btn {
  position: relative;
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: #0b090f;
  border: 2px solid #a066ff;
  color: #a066ff;
  box-shadow: 0 0 12px rgba(160, 102, 255, 0.4);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: sans-serif;
  font-size: 22px;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  -webkit-tap-highlight-color: transparent;
}

#widget-trigger-btn.active {
  background: #a066ff;
  color: #0b090f;
  box-shadow: 0 0 20px #a066ff;
  transform: rotate(90deg);
}

/* Вылетающая вверх панель-колбаска */
#neo-panel-widget {
  position: relative;
  width: 60px;
  background: rgba(11, 9, 15, 0.95);
  border: 1px solid rgba(160, 102, 255, 0.6);
  border-radius: 30px;
  padding: 15px 5px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  opacity: 0;
  filter: blur(10px);
  transform: translateY(30px) scale(0.5);
  transform-origin: bottom center;
  pointer-events: none;
  transition: 
    opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1),
    filter 0.4s cubic-bezier(0.4, 0, 0.2, 1),
    transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 0 20px rgba(160, 102, 255, 0.3);
  backdrop-filter: blur(8px);
}

#neo-panel-widget.show {
  opacity: 1;
  filter: blur(0px);
  transform: translateY(0) scale(1);
  pointer-events: auto;
}

.widget-status {
  font-family: monospace;
  font-size: 8px;
  color: #bcaada;
  text-align: center;
  letter-spacing: 0.5px;
  text-shadow: 0 0 4px rgba(188, 170, 218, 0.4);
  text-transform: uppercase;
  margin-bottom: 4px;
}

/* Кнопки внутри колбаски (Aa) */
#widget-zoom-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: #050407;
  border: 1px solid #a066ff;
  color: #a066ff;
  font-family: sans-serif;
  font-weight: bold;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.2s ease;
  box-shadow: 0 0 8px rgba(160, 102, 255, 0.2);
  -webkit-tap-highlight-color: transparent;
}

#widget-zoom-btn.active {
  background: #a066ff;
  color: #050407;
  box-shadow: 0 0 15px #a066ff;
}
  
/* Инспектор текста */
body.text-zoom-mode .wrapper h1,
body.text-zoom-mode .wrapper h2,
body.text-zoom-mode .wrapper h3,
body.text-zoom-mode .wrapper h4,
body.text-zoom-mode .wrapper p,
body.text-zoom-mode .wrapper li {
  cursor: pointer !important;
}

body.text-zoom-mode .wrapper .zoomed-active,
body.text-zoom-mode .wrapper * .zoomed-active,
body.text-zoom-mode .wrapper p.zoomed-active,
body.text-zoom-mode .wrapper h4.zoomed-active {
  font-size: 36px !important;
  line-height: 1.3 !important;
  color: #ffffff !important;
  text-shadow: 0 0 20px #a066ff, 0 0 8px rgba(160, 102, 255, 0.6) !important;
}

/* Поиск */
#widget-search-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: #050407;
  border: 1px solid #a066ff;
  color: #a066ff;
  font-family: sans-serif;
  font-weight: bold;
  font-size: 18px;
  cursor: pointer;
  transition: all 0.2s ease;
  box-shadow: 0 0 8px rgba(160, 102, 255, 0.2);
  -webkit-tap-highlight-color: transparent;
}

#widget-search-btn:hover {
  background: rgba(160, 102, 255, 0.2);
  box-shadow: 0 0 12px #a066ff;
}

#widget-search-btn.active {
  background: #a066ff;
  color: #050407;
  box-shadow: 0 0 15px #a066ff;
}

/* Экспериментальные функции и «Для разработчиков» (оформлены как остальные) */
#widget-experimental-btn,
#widget-dev-btn {
  box-sizing: border-box;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: #050407;
  border: 1px solid #a066ff;
  color: #a066ff;
  font-family: sans-serif;
  font-weight: bold;
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  cursor: pointer;
  transition: all 0.2s ease;
  box-shadow: 0 0 8px rgba(160, 102, 255, 0.2);
  -webkit-tap-highlight-color: transparent;
}
#widget-dev-btn {
  font-family: ui-monospace, Menlo, Consolas, monospace;
  font-size: 13px;
  padding: 0;
}

#widget-experimental-btn:hover,
#widget-experimental-btn:active,
#widget-dev-btn:hover,
#widget-dev-btn:active {
  background: rgba(160, 102, 255, 0.2);
  box-shadow: 0 0 12px #a066ff;
  color: #a066ff;
}
</style>
  
<script>
document.addEventListener("DOMContentLoaded", () => {
  const tBtn = document.getElementById("widget-trigger-btn");
  const pnl = document.getElementById("neo-panel-widget");
  if(tBtn && pnl) tBtn.onclick = (e) => { e.stopPropagation(); tBtn.classList.toggle("active"); pnl.classList.toggle("show"); };
  let zoomBtn = null;
  let statusText = null;
  let isZoomModeActive = false;

  // Безопасная инициализация: ищем элементы, даже если они загрузились позже
  function initZoom() {
    zoomBtn = document.getElementById("widget-zoom-btn");
    statusText = document.querySelector("#neo-panel-widget .widget-status");

    if (!zoomBtn) {
      setTimeout(initZoom, 100);
      return;
    }

    zoomBtn.addEventListener("click", (e) => {
      e.stopPropagation(); // Защита от закрытия колбасы
      toggleZoomMode();
    });
  }

  function toggleZoomMode() {
    isZoomModeActive = !isZoomModeActive;
    
    if (isZoomModeActive) {
      zoomBtn.classList.add("active");
      document.body.classList.add("text-zoom-mode");
      if (statusText) {
        statusText.textContent = "ИНСПЕКТОР";
        statusText.style.color = "#a066ff";
      }
    } else {
      zoomBtn.classList.remove("active");
      document.body.classList.remove("text-zoom-mode");
      if (statusText) {
        statusText.textContent = "СТАНДАРТ";
        statusText.style.color = "#bcaada";
      }
      document.querySelectorAll(".zoomed-active").forEach(el => el.classList.remove("zoomed-active"));
    }
  }

  // Логика клика по тексту (вешаем на весь документ, чтобы работало всегда)
  document.addEventListener("click", (e) => {
    if (!isZoomModeActive) return;
    
    const textEl = e.target.closest("p, h1, h2, h3, h4, h5, h6, li");
    
    if (textEl && !e.target.closest("#neo-corner-widget")) {
      e.preventDefault();
      textEl.classList.toggle("zoomed-active");
    }
  });

  window.widgetResetZoom = () => {
    if (isZoomModeActive) toggleZoomMode();
  };

  initZoom();

  // «Для разработчиков» (>_): панель грузится только по клику
  const devBtn = document.getElementById("widget-dev-btn");
  if (devBtn) {
    devBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      if (window.A51Dev) { window.A51Dev.open(); return; }
      const s = document.createElement("script");
      s.src = "{{ '/js/dev.js' | relative_url }}";
      s.onload = () => window.A51Dev && window.A51Dev.open();
      s.onerror = () => alert("Не удалось загрузить панель разработчика.");
      document.head.appendChild(s);
    });
  }
});

  // Поиск: список страниц лежит отдельным файлом search.json и грузится только тогда,
  // когда пользователь нажимает на поиск
let wikiDatabase = null, wikiLoading = null;
function loadWikiIndex() {
  if (wikiDatabase) return Promise.resolve(wikiDatabase);
  if (!wikiLoading) {
    wikiLoading = fetch("{{ '/search.json' | relative_url }}")
      .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(list => (wikiDatabase = list.map(p => ({ title: String(p.title).toLowerCase(), url: p.url }))))
      .catch(err => { wikiLoading = null; throw err; });
  }
  return wikiLoading;
}

// Логика работы кнопки поиска
const searchBtn = document.getElementById("widget-search-btn");

if (searchBtn) {
  searchBtn.addEventListener("click", (e) => {
    e.stopPropagation(); // Защита, чтобы «колбаска» не закрылась при клике
    
    searchBtn.classList.add("active");
    
    // Список страниц начинает грузиться сразу, пока пользователь вводит запрос
    const indexReady = loadWikiIndex();
    indexReady.catch(() => {});
    
    // Задержка в 50мс, чтобы браузер успел отрисовать подсветку кнопки перед вызовом prompt
    setTimeout(async () => {
      const query = prompt("Введите название статьи для поиска:");
      
      if (!query || query.trim() === "") {
        searchBtn.classList.remove("active");
        return;
      }
      
      const cleanQuery = query.trim().toLowerCase();
      
      let db;
      try {
        db = await indexReady;
      } catch (err) {
        searchBtn.classList.remove("active");
        alert("Не удалось загрузить список статей. Проверьте интернет и попробуйте ещё раз.");
        return;
      }
      
      const result = db.find(item => item.title.includes(cleanQuery));
      
      if (result) {
        window.location.href = result.url;
      } else {
        searchBtn.classList.remove("active");
        alert("Статья с таким названием не найдена в Вики.");
      }
    }, 50);
  });
}
 </script>
