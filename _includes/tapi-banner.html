{% if page.name == 'index.md' %}
<script>
(function () {
  var K_COUNT = 'tapi-shown-count';  // сколько раз плашка уже показывалась
  var K_NEVER = 'tapi-never';        // отмечено "Get out playa!"
  var K_SESSION = 'tapi-session';    // этот визит уже обработан

  // Страны, где плашка НЕ показывается: РФ, Беларусь, Украина, Казахстан, Кыргызстан,
  // Узбекистан, Таджикистан, Туркменистан, Армения.
  // Абхазия и Южная Осетия отдельных кодов в базах IP не имеют (обычно это GE), см. ниже.
  var EXCLUDED = ['RU', 'BY', 'UA', 'KZ', 'KG', 'UZ', 'TJ', 'TM', 'AM'];

  // Отладка: добавьте к адресу ?tapi-debug, и на экране появится журнал работы скрипта.
  // Также: ?tapi-reset (сброс счётчика/галочки) и ?tapi-country=NL (подмена страны).
  var DEBUG = /[?&]tapi-debug/.test(location.search);
  var logLines = [];
  var logBox = null;
  function log(msg) {
    logLines.push(msg);
    if (!DEBUG) return;
    if (!logBox) {
      logBox = document.createElement('pre');
      logBox.style.cssText = 'position:fixed;top:0;left:0;right:0;max-height:45vh;overflow:auto;margin:0;' +
        'z-index:2147483647;background:#000;color:#0f0;font:11px/1.3 monospace;padding:6px;white-space:pre-wrap';
      document.documentElement.appendChild(logBox);
    }
    logBox.textContent = logLines.join('\n');
  }

  function get(s, k) { try { return s.getItem(k); } catch (e) { return 'ERR:' + e; } }
  function put(s, k, v) { try { s.setItem(k, v); return true; } catch (e) { log('storage write failed: ' + e); return false; } }

  log('banner script loaded (v4)');

  if (/[?&]tapi-reset/.test(location.search)) {
    try {
      localStorage.removeItem(K_COUNT);
      localStorage.removeItem(K_NEVER);
      sessionStorage.removeItem(K_SESSION);
      log('storage reset');
    } catch (e) { log('reset failed: ' + e); }
  }

  var never = get(localStorage, K_NEVER);
  var sess = get(sessionStorage, K_SESSION);
  log('never=' + never + ' session=' + sess + ' count=' + get(localStorage, K_COUNT));
  if (never) { log('STOP: "Get out playa!" was checked earlier (add ?tapi-reset)'); return; }
  if (sess) { log('STOP: this visit already handled (open in a new tab or add ?tapi-reset)'); return; }

  var providers = [
    { name: 'country.is', url: 'https://api.country.is/', pick: function (d) { return d.country; } },
    { name: 'ipwho.is', url: 'https://ipwho.is/', pick: function (d) { return d.success === false ? null : d.country_code; } },
    { name: 'ipapi.co', url: 'https://ipapi.co/json/', pick: function (d) { return d.country_code || d.country; } }
  ];

  function fetchJson(url) {
    var ctrl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 5000);
    return fetch(url, ctrl ? { signal: ctrl.signal } : {}).then(function (r) {
      clearTimeout(timer);
      return r.json();
    });
  }

  async function detectCountry() {
    var m = location.search.match(/[?&]tapi-country=([A-Za-z]{2})/);
    if (m) { log('country forced via URL: ' + m[1]); return m[1].toUpperCase(); }
    for (var i = 0; i < providers.length; i++) {
      try {
        var d = await fetchJson(providers[i].url);
        var c = providers[i].pick(d);
        log(providers[i].name + ' -> ' + (c || 'no country') + ' (ip ' + (d.ip || '?') + ')');
        if (c) return String(c).toUpperCase();
      } catch (e) {
        log(providers[i].name + ' FAILED: ' + e);
      }
    }
    return null;
  }

  function showBanner(withCheckbox) {
    var bar = document.createElement('div');
    bar.style.cssText = 'position:fixed;left:12px;right:84px;bottom:12px;z-index:2147483646;' +
      'background:#222;color:#fff;padding:12px 40px 12px 14px;border-radius:10px;' +
      'font:14px/1.4 sans-serif;box-shadow:0 4px 16px rgba(0,0,0,.4)';

    bar.innerHTML =
      'Don\'t understand what\'s written here? Download extension ' +
      '<b>tapi-extension.zip</b> in repo ' +
      '<a style="color:#6cf" target="_blank" rel="noopener" ' +
      'href="https://github.com/kpblm4ik/TAPI-Translating-Application-Programming-Interface-">' +
      'kpblm4ik/TAPI-Translating-Application-Programming-Interface-</a>' +
      '<span id="tapi-x" style="position:absolute;right:12px;top:8px;cursor:pointer;font-size:18px">\u2715</span>' +
      (withCheckbox
        ? '<label style="display:block;margin-top:8px;cursor:pointer">' +
          '<input type="checkbox" id="tapi-never"> Get out playa!</label>'
        : '');

    document.documentElement.appendChild(bar);

    bar.querySelector('#tapi-x').onclick = function () { bar.remove(); };

    var cb = bar.querySelector('#tapi-never');
    if (cb) cb.onchange = function () {
      if (cb.checked) {
        put(localStorage, K_NEVER, '1');
        bar.remove();
      }
    };
  }

  (async function () {
    var country = await detectCountry();
    if (!country) { log('STOP: country not detected (all providers failed, maybe blocked by an ad blocker)'); return; }
    put(sessionStorage, K_SESSION, '1');
    if (EXCLUDED.indexOf(country) !== -1) { log('STOP: country ' + country + ' is excluded, no banner'); return; }

    var prev = parseInt(get(localStorage, K_COUNT) || '0', 10) || 0;
    put(localStorage, K_COUNT, String(prev + 1));
    log('SHOWING banner for ' + country + ' (checkbox: ' + (prev >= 1) + ')');
    showBanner(prev >= 1);
  })();
})();
</script>
{% endif %}
