<style>
/* Режим инспектора текста: включаем аппаратное сглаживание для плавной анимации */
body.text-zoom-mode .wrapper p,
body.text-zoom-mode .wrapper h1,
body.text-zoom-mode .wrapper h4 {
  cursor: pointer;
  will-change: font-size, line-height;
  transition: 
    font-size 0.25s cubic-bezier(0.25, 1, 0.5, 1),
    line-height 0.25s cubic-bezier(0.25, 1, 0.5, 1),
    text-shadow 0.25s ease,
    color 0.25s ease !important;
}

/* Плавное увеличение обычного абзаца по клику */
body.text-zoom-mode .wrapper p.zoomed-active {
  font-size: 45px !important;
  line-height: 1.25 !important;
  text-shadow: 0 0 15px #a066ff, 0 0 5px rgba(160, 102, 255, 0.5) !important;
  color: #ffffff !important;
}

/* Увеличение заголовков по клику */
body.text-zoom-mode .wrapper h1.zoomed-active,
body.text-zoom-mode .wrapper h4.zoomed-active {
  font-size: 52px !important;
  line-height: 1.2 !important;
  text-shadow: 0 0 15px #a066ff, 0 0 5px rgba(160, 102, 255, 0.5) !important;
  color: #ffffff !important;
}
</style>

<script>
document.addEventListener("DOMContentLoaded", () => {
  let zoomBtn = null;
  let statusText = null;
  let isZoomModeActive = false;

  // Безопасная инициализация: ищем элементы, даже если они загрузились позже
  function initZoom() {
    zoomBtn = document.getElementById("widget-zoom-btn");
    statusText = document.querySelector("#neo-panel-widget .widget-status");

    // Если кнопки еще нет на экране, пробуем снова через 100 миллисекунд
    if (!zoomBtn) {
      setTimeout(initZoom, 100);
      return;
    }

    // Как только нашли кнопку — вешаем на нее событие клика
    zoomBtn.addEventListener("click", (e) => {
      e.stopPropagation(); // Защита от закрытия колбасы
      toggleZoomMode();
    });
  }

  function toggleZoomMode() {
    isZoomModeActive = !isZoomModeActive;
    
    if (isZoomModeActive) {
      zoomBtn.classList.add("active");
      document.body.classList.add("text-zoom-mode");
      if (statusText) {
        statusText.textContent = "ИНСПЕКТОР";
        statusText.style.color = "#a066ff";
      }
    } else {
      zoomBtn.classList.remove("active");
      document.body.classList.remove("text-zoom-mode");
      if (statusText) {
        statusText.textContent = "СТАНДАРТ";
        statusText.style.color = "#bcaada";
      }
      document.querySelectorAll(".zoomed-active").forEach(el => el.classList.remove("zoomed-active"));
    }
  }

  // Логика клика по тексту (вешаем на весь документ, чтобы работало ВСЕГДА)
  document.addEventListener("click", (e) => {
    if (!isZoomModeActive) return;
    
    // Ищем, был ли клик по тексту внутри .wrapper
    const textEl = e.target.closest("p, h1, h4");
    
    // Дополнительная проверка, чтобы клик случайно не сработал на кнопках меню
    if (textEl && !e.target.closest("#neo-corner-widget")) {
      e.preventDefault();
      textEl.classList.toggle("zoomed-active");
    }
  });

  // Экспорт функции сброса для первого файла
  window.widgetResetZoom = () => {
    if (isZoomModeActive) toggleZoomMode();
  };

  // Запускаем поиск кнопки
  initZoom();
});
</script>
