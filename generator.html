<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор статей | A51BFCTS Wiki</title>
    <!-- Подключаем ваши глобальные стили, если они есть в /css/, 
         иначе используем встроенные переменные из editor.html -->
    <link rel="stylesheet" href="css/global.css"> 
    <style>
        /* Базовые переменные из вашего editor.html для автономности */
        :root {
            --bg: #0b090f;
            --panel: #16121f;
            --panel-hi: #1e182b;
            --neon-line: rgba(160, 102, 255, .4);
            --ink: #e2daf0;
            --ink-soft: #9d93ad;
            --display: 'Segoe UI', system-ui, sans-serif;
        }
        
        body {
            background: var(--bg);
            color: var(--ink);
            font-family: var(--display);
            margin: 0;
            padding: 20px;
            line-height: 1.5;
        }

        a { color: #a066ff; text-decoration: none; }
        a:hover { text-decoration: underline; }

        h1 { 
            margin: 0 0 10px; 
            font-family: var(--display); 
            color: var(--ink); 
            text-shadow: 0 0 8px rgba(160,102,255,.6); 
        }

        .layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            max-width: 1200px;
            margin: 0 auto;
        }

        @media (max-width: 800px) {
            .layout { grid-template-columns: 1fr; }
        }

        /* Переиспользуем ваши классы из editor.html */
        .ed-card textarea {
            background: #120e1a;
            color: #e2daf0;
            border: 1px solid var(--neon-line);
            border-radius: 8px;
            padding: 8px;
            font-size: 14px;
            width: 100%;
            box-sizing: border-box;
            resize: vertical;
            min-height: 120px;
            font-family: 'Consolas', monospace;
        }

        .code-preview {
            background: #000;
            border: 1px solid var(--neon-line);
            border-radius: 8px;
            padding: 12px;
            font-family: 'Consolas', monospace;
            font-size: 13px;
            white-space: pre-wrap;
            word-break: break-word;
            color: #c8bfe7;
            min-height: 300px;
            max-height: 70vh;
            overflow-y: auto;
        }

        .actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>

<div style="max-width: 1200px; margin: 0 auto;">
    <h1>📝 Генератор новых страниц</h1>
    <p class="hint" style="margin-bottom: 20px;">
        <a href="index.html">🏠 Главная</a> · 
        <a href="editor.html">🎨 Редактор обложек</a> · 
        <a href="coil-editor.html">⚡ Редактор катушки</a>
    </p>

    <div class="layout">
        <!-- Левая колонка: Настройки -->
        <div>
            <div class="ed-card">
                <h3>Параметры статьи</h3>
                
                <div class="ed-row">
                    <label style="flex:1">Название объекта
                        <input type="text" id="pageTitle" placeholder="Coil of Speed" oninput="generate()">
                    </label>
                </div>

                <div class="ed-row">
                    <label style="flex:1">Категория / Сектор
                        <select id="category" onchange="generate()">
                            <option value="Coils">⚡ Катушки (Coils)</option>
                            <option value="Wands">🪄 Палочки (Wands)</option>
                            <option value="Items">📦 Прочие предметы</option>
                            <option value="Locations">🗺️ Локации / Координаты</option>
                            <option value="Glitches">👾 Глитчи / Аномалии</option>
                        </select>
                    </label>
                </div>

                <div class="ed-row">
                    <label style="flex:1">Статус / Редкость
                        <input type="text" id="status" placeholder="Legendary / Secret" oninput="generate()">
                    </label>
                </div>
            </div>

            <div class="ed-card">
                <h3>Содержание</h3>
                
                <div class="ed-row">
                    <label style="flex:1">Краткое описание (Lead)
                        <textarea id="description" rows="3" placeholder="Артефакт скорости, позволяющий..." oninput="generate()"></textarea>
                    </label>
                </div>

                <div class="ed-row">
                    <label style="flex:1">Основной текст (Wikitext)
                        <textarea id="content" rows="8" placeholder="== Получение ==&#10;Описание метода получения...&#10;&#10;== Характеристики ==" oninput="generate()"></textarea>
                    </label>
                </div>
            </div>
        </div>

        <!-- Правая колонка: Результат -->
        <div>
            <div class="ed-card">
                <h3>Результат (Wikitext)</h3>
                <div id="output" class="code-preview"></div>
                
                <div class="actions">
                    <button class="ed-btn" onclick="copyCode()">📋 Копировать код</button>
                    <button class="ed-btn" onclick="downloadWiki()">💾 Скачать .wiki</button>
                </div>
                <p class="hint" id="charCount" style="margin-top: 8px;">0 символов</p>
            </div>
        </div>
    </div>
</div>

<script>
    function generate() {
        const title = document.getElementById('pageTitle').value.trim() || 'Unnamed Object';
        const cat = document.getElementById('category').value;
        const status = document.getElementById('status').value.trim() || 'Unknown';
        const desc = document.getElementById('description').value.trim();
        const body = document.getElementById('content').value;

        // Шаблон адаптирован под структуру A51BFCTS Wikipedia
        let out = `{{Infobox\n`;
        out += `| name   = ${title}\n`;
        out += `| sector = ${cat}\n`;
        out += `| status = ${status}\n`;
        out += `}}\n\n`;

        if (desc) out += `${desc}\n\n`;

        if (body) {
            out += `${body}\n\n`;
        } else {
            out += `== Описание ==\nИнформация отсутствует.\n\n`;
            out += `== Примечания ==\n* Данные получены через датамайнинг.\n`;
        }

        out += `[[Category:${cat}]]\n`;
        out += `[[Category:A51BFCTS]]`;

        const outputEl = document.getElementById('output');
        outputEl.textContent = out;
        document.getElementById('charCount').textContent = `${out.length} символов`;
    }

    function copyCode() {
        const text = document.getElementById('output').textContent;
        navigator.clipboard.writeText(text).then(() => {
            const btn = document.querySelector('.actions .ed-btn');
            const original = btn.textContent;
            btn.textContent = '✅ Скопировано!';
            setTimeout(() => btn.textContent = original, 2000);
        });
    }

    function downloadWiki() {
        const text = document.getElementById('output').textContent;
        const title = document.getElementById('pageTitle').value.trim() || 'new_page';
        const safeName = title.replace(/[^a-zа-яё0-9_]/gi, '_');
        
        const blob = new Blob([text], { type: 'text/plain' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `${safeName}.wiki`;
        a.click();
        URL.revokeObjectURL(a.href);
    }

    // Инициализация
    generate();
</script>

</body>
</html>
