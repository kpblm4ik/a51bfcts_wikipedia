---
layout: default
---
{% assign im = '/images/' | relative_url %}
<link rel="stylesheet" href="{{ '/css/news.css' | relative_url }}">
<article class="news-article">
  <header class="na-hero">
    {% if page.img %}<img src="{{ im }}{{ page.img }}" alt="">{% endif %}
    <div class="na-t"><small>{{ page.date_ru }}{% if page.author %} · {{ page.author }}{% endif %}</small><h1>{{ page.title }}</h1></div>
  </header>
  <div class="na-body">
{{ content }}
  </div>
  <p class="na-back"><a href="{{ '/' | relative_url }}#news">← Все новости</a></p>
</article>
