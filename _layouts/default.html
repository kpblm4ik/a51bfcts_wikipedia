<!DOCTYPE html>
<html lang="{{ page.lang | default: 'ru' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: 'a51bfcts Вики' }}</title>
    <style>
        html, body {
            margin: 0;
            padding: 10px;
            min-height: 100vh;
            font-family: sans-serif;
        }

        /* Стабильный фон для ВСЕХ страниц сайта */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-image: 
                linear-gradient(rgba(5, 4, 7, 0.6), rgba(5, 4, 7, 0.6)), 
                url('{{ site.baseurl }}/Screenshot_20261006_110338.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -2;
            pointer-events: none;
        }

        .wrapper {
            max-width: 600px;
            margin: 0 auto;
            background-color: #0b090f !important;
            box-shadow: 0 0 40px rgba(138, 43, 226, 0.4);
            border-radius: 12px;
            padding: 20px;
            position: relative;
            z-index: 1;
            box-sizing: border-box;
        }

        /* То самое простое скругление для ВСЕХ фоток на сайте */
        img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 10px auto;
            border-radius: 12px; 
            box-sizing: border-box;
        }

        /* Базовый футер */
        footer {
            margin-top: 40px;
            text-align: center;
            font-size: 14px;
            color: #8c829e !important;
            border-top: 1px solid rgba(160, 102, 255, 0.1);
            padding-top: 15px;
            font-family: sans-serif;
        }
        footer p { margin: 5px 0; color: #8c829e !important; }
    </style>

    <!-- Подключение тех самых микростилей страниц -->
    {% if page.custom_css %}
    <link rel="stylesheet" href="{{ page.custom_css | relative_url }}">
    {% endif %}
</head>
<body>
    <div class="wrapper">
        
        <!-- Контент страниц -->
        {{ content }}

        <!-- Подвал сайта -->
        <footer>
            <p>kpblm4ik 2026 ©</p>
            <p>Защищено лицензией CC-BY-NC-ND 4.0</p>
        </footer>
    </div>
</body>
</html>
