    <style>
        html, body {
            background-color: #050407 !important;
            color: #e2daf0 !important;
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            position: relative;
        }

        /* Настройка фоновой картинки с яркостью 40% */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Путь к вашей картинке. Если она лежит в корне репозитория, оставляйте так */
            background-image: url('/Screenshot_20261006_110338.jpg'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: brightness(40%); /* Уменьшаем яркость фона до 40% */
            z-index: -1; /* Уводит картинку под текст и обертку */
        }

        .wrapper {
            position: relative; /* Чтобы контент был поверх размытого фона */
            max-width: 800px;
            margin: 0 auto;
            background-color: #0b090f !important;
            box-shadow: 0 0 40px rgba(138, 43, 226, 0.4);
            border-radius: 8px;
            padding: 20px;
        }
        img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 10px auto;
            border-radius: 6px;
        }
        a {
            color: #a066ff !important;
            text-decoration: none;
        }
        /* Стили для списков, чтобы они не слипались */
        ul {
            padding-left: 20px;
            line-height: 1.6;
        }
        li {
            margin-bottom: 8px;
        }
    </style>
