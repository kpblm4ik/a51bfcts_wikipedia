    <style>
        html, body {
            color: #e2daf0 !important;
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        /* Железобетонный и плавный фон без прыжков на смартфонах */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            /* Вуаль 60% темноты поверх картинки */
            background-image: 
                linear-gradient(rgba(5, 4, 7, 0.6), rgba(5, 4, 7, 0.6)), 
                url('{{ site.baseurl }}/Screenshot_20261006_110338.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -2; /* Убираем в самый низ */
            pointer-events: none; /* Чтобы слой не мешал кликать по ссылкам */
        }

        .wrapper {
            max-width: 800px;
            margin: 0 auto;
            background-color: #0b090f !important;
            box-shadow: 0 0 40px rgba(138, 43, 226, 0.4);
            border-radius: 8px;
            padding: 20px;
            position: relative;
            z-index: 1;
        }
        
        img { 
            max-width: 100%; 
            height: auto; 
            display: block; 
            margin: 10px auto; 
            border-radius: 6px; 
        }

        /* ТЕ САМЫЕ ССЫЛКИ, ОНИ ТУТ! */
        a { 
            color: #a066ff !important; 
            text-decoration: none; 
        }

        ul { 
            padding-left: 20px; 
            line-height: 1.6; 
        }
        
        li { 
            margin-bottom: 8px; 
        }
    </style>

    <!-- Автоматическое подключение микростилей для конкретной страницы -->
    {% if page.custom_css %}
    <link rel="stylesheet" href="{{ page.custom_css | relative_url }}">
    {% endif %}
