<!DOCTYPE html>
<html lang="{{ page.lang | default: 'ru' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: 'a51bfcts Вики' }}</title>
    <style>
        html, body {
            margin: 0;
            padding: 10px;
            min-height: 100vh;
            font-family: sans-serif;
            background-color: #050407 !important;
            color: #e2daf0 !important;
        }

        /* Твой крутой зафиксированный фон с идеальными настройками яркости */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-image: url('{{ site.baseurl }}/Screenshot_20261006_110338.jpg');
            background-size: cover;
            background-position: center top;
            filter: brightness(0.24) contrast(1.4) saturate(1.3) !important;
            z-index: -2;
            pointer-events: none;
        }

        .wrapper {
            max-width: 600px;
            margin: 0 auto;
            background-color: #0b090f !important;
            box-shadow: 0 0 40px rgba(138, 43, 226, 0.4), 0 0 10px rgba(138, 43, 226, 0.2) !important;
            border-radius: 8px;
            padding: 20px;
            position: relative;
            z-index: 1;
            box-sizing: border-box;
        }

        a {
            color: #a066ff !important;
            text-shadow: 0 0 5px rgba(160, 102, 255, 0.3);
            text-decoration: none;
        }

        img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 10px auto;
            border-radius: 12px;
        }

        footer {
            margin-top: 40px;
            text-align: center;
            font-size: 14px;
            color: #8c829e !important;
            border-top: 1px solid rgba(160, 102, 255, 0.1);
            padding-top: 15px;
        }
        footer p { margin: 5px 0; color: #8c829e !important; }
    </style>

    <!-- Подключение микростилей страниц -->
    {% if page.custom_css %}
    <link rel="stylesheet" href="{{ page.custom_css | relative_url }}">
    {% endif %}
</head>
<body>
    <div class="wrapper">
        {{ content }}
                <footer>
  <img src="{{ site.baseurl }}/1000033782.png" alt="Area 51 But Find Coils To Survive">
  <p>kpblm4ik 2026 ©</p>
  <p>Защищено лицензией CC-BY-NC-ND 4.0</p>
                </footer>
        <!-- Кнопка включения лупы -->
<button id="magnifier-toggle-btn" style="position:fixed; bottom:20px; right:20px; z-index:999; padding:12px 16px; font-size:20px; background:#0b090f; border:2px solid #8a2be2; border-radius:50%; cursor:pointer; box-shadow:0 0 15px rgba(138,43,226,0.5);">🔍</button>

<!-- Сам элемент экранной лупы -->
<div id="screen-magnifier" style="display:none; position:fixed; border:3px solid #8a2be2; border-radius:8px; background:#0b090f; box-shadow:0 0 30px rgba(138,43,226,0.6); flex-direction:column; z-index:998; overflow:hidden; will-change: transform;">
  <!-- Шапка для перетаскивания -->
  <div id="magnifier-drag-handle" style="height:24px; background:#1a1524; cursor:move; display:flex; align-items:center; justify-content:center; font-size:10px; color:#8c829e; border-bottom:1px solid rgba(160,102,255,0.2);">⬤ ⬤ ⬤</div>
  <!-- Зона отображения увеличенного контента -->
  <div id="magnifier-viewer" style="flex:1; position:relative; overflow:hidden; background:#050407;">
    <div id="magnifier-mirror" style="position:absolute; top:0; left:0; transform-origin:0 0; pointer-events:none; will-change: transform;"></div>
  </div>
  <!-- Уголок для изменения размера -->
  <div id="magnifier-resize-handle" style="position:absolute; bottom:0; right:0; width:15px; height:15px; background:linear-gradient(135deg, transparent 50%, #8a2be2 50%); cursor:se-resize;"></div>
</div> 
</div>
 {% include magnifier.html %}
</body>
</html>
