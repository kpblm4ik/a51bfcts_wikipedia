<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Архивы Зоны 51</title>
    <style>
        html, body {
            background-color: #050407 !important;
            color: #e2daf0 !important;
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
        }
        .wrapper {
            max-width: 800px;
            margin: 0 auto;
            background-color: #0b090f !important;
            box-shadow: 0 0 40px rgba(138, 43, 226, 0.4);
            border-radius: 8px;
            padding: 20px;
        }
        img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 10px auto;
            border-radius: 6px;
        }
        a {
            color: #a066ff !important;
            text-decoration: none;
        }
        /* Стили для списков, чтобы они не слипались */
        ul {
            padding-left: 20px;
            line-height: 1.6;
        }
        li {
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <!-- Две скобки — стандарт для Eleventy (Liquid) -->
        {{ content }}
    </div>
</body>
</html>
