<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>{{ page.title | default: "Вики a51bfcts" }}</title>
  
  <!-- ПОДКЛЮЧАЕМ ТОПОВЫЕ ИГРОВЫЕ ШРИФТЫ -->
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Rubik+Mono+One&family=Rubik:wght@900&display=swap" rel="stylesheet">

  <style>
    /* ================= 🪐 НАШ ФИРМЕННЫЙ НЕОНОВЫЙ ДИЗАЙН ================= */
    html, body { 
      background-color: #050407 !important; color: #e2daf0 !important; 
      margin: 0 !important; padding: 0 !important; font-family: sans-serif;
    }
    
    /* Компактный игровой блок для контента Obsidian */
    .wiki-content-box {
      position: relative; background-color: #0b090f !important;
      box-shadow: 0 0 40px rgba(138, 43, 226, 0.4), 0 0 10px rgba(138, 43, 226, 0.2) !important;
      border-radius: 8px; padding: 20px !important; z-index: 1; overflow: hidden;
      margin: 20px auto !important; max-width: 600px !important; box-sizing: border-box;
    }
    
    /* Фоновые приближенные спирали */
    .wiki-content-box::before {
      content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-image: url('Screenshot_20261006_110338.jpg') !important;
      background-size: cover !important; background-position: center top !important;
      filter: brightness(0.24) contrast(1.4) saturate(1.3) !important; z-index: -1; opacity: 0.9;
    }
    
    a { color: #a066ff !important; text-shadow: 0 0 5px rgba(160, 102, 255, 0.3); text-decoration: none; }
    img { max-width: 100% !important; height: auto !important; border-radius: 6px; display: block; margin: 10px auto; }
    [lang="en"], [lang="es"] { display: none; }

    /* 🛠️ ПЕРЕКРАШИВАЕМ БИРЮЗОВУЮ ШАПКУ И ПОДВАЛ В ЦВЕТА ИГРЫ */
    .page-header {
      background-image: none !important; background-color: #050407 !important; 
      padding: 1.5rem 1rem !important; text-align: center !important; margin: 0 !important;
    }
    .project-name { font-family: 'Rubik Mono One', sans-serif; font-size: 2rem !important; color: #fff !important; text-shadow: 0 0 15px #a066ff !important; }
    .project-tagline { color: #bcaada !important; font-size: 1rem !important; }
    .site-footer, .btn { display: none !important; }
    .main-content { padding: 0 !important; max-width: 100% !important; background: none !important; }

    /* ДИЗАЙН СЕТКИ ДЛЯ КАТАЛОГОВ (2 В РЯД) */
    .items-grid { display: flex; flex-wrap: wrap; gap: 15px; margin-top: 20px; }
    .item-card {
      flex: 1 1 calc(50% - 8px); min-width: 140px; background-color: rgba(20, 16, 28, 0.7);
      border: 1px solid rgba(160, 102, 255, 0.3); border-radius: 6px; padding: 10px; box-sizing: border-box;
      text-align: center; display: flex; flex-direction: column; align-items: center;
      transition: transform 0.2s, box-shadow 0.2s; cursor: pointer;
    }
    .item-card:hover { transform: scale(1.03); box-shadow: 0 0 15px rgba(160, 102, 255, 0.6); border-color: #a066ff; }
    .item-card img { width: 100%; height: auto; border-radius: 4px; margin-bottom: 8px; }
    .item-card h3 { margin: 5px 0; color: #fff; font-size: 16px; }
    .item-card p { margin: 2px 0; font-size: 13px; color: #bcaada; }

    /* ДИЗАЙН ИГРОВЫХ ТАБЛИЦ В СТИЛЕ ФАНДОМА */
    .wiki-infobox {
      background-color: #121016; border: 3px solid #2d263a; border-radius: 4px;
      max-width: 420px; margin: 25px auto; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    }
    .infobox-title {
      background-color: #241d2f; color: #ffffff; text-align: center; padding: 12px; 
      font-family: 'Rubik Mono One', sans-serif; font-size: 16px; border-bottom: 3px solid #2d263a; letter-spacing: 1px;
    }
    .infobox-section-header {
      background-color: #e2b316; color: #000000; text-align: center; padding: 6px;
      font-family: 'Rubik', sans-serif; font-weight: 900; font-size: 14px; text-transform: uppercase; letter-spacing: 1px;
    }
    .infobox-grid { display: flex; background-color: #1a1622; }
    .infobox-cell { flex: 1; padding: 10px; text-align: center; font-family: 'Rubik', sans-serif; font-size: 13px; border-bottom: 2px solid #2d263a; }
    .infobox-cell.label { background-color: #15111c; color: #ffffff; font-weight: bold; border-right: 2px solid #2d263a; }
    .infobox-cell.value { color: #e2daf0; }
    
    .difficulty-easy { color: #00ff66; font-weight: bold; text-shadow: 0 0 8px rgba(0, 255, 102, 0.4); }
    .difficulty-insane { color: #ff3333; font-weight: bold; text-shadow: 0 0 10px rgba(255, 51, 51, 0.6); text-transform: uppercase; }
    .stat-speed { color: #00ffcc; font-weight: bold; }
    .stat-jump { color: #ffcc00; font-weight: bold; }
    
    .photo-row { display: flex; flex-wrap: wrap; gap: 15px; margin: 20px 0; }
    .photo-col { flex: 1 1 calc(50% - 8px); min-width: 140px; }
    .photo-col img { width: 100%; height: auto; border-radius: 6px; border: 1px solid rgba(160, 102, 255, 0.4); }
  </style>
</head>
<body>

  <!-- НАШЕ НОВОЕ БЕЗОПАСНОЕ ОКНО ДЛЯ МАРКДАУНА -->
  <div class="wiki-content-box">
    {{ content }}
  </div>

  <!-- КНОПКИ ПЕРЕВОДА -->
  <p align="center" style="font-size: 18px; margin-top: 30px; font-family: sans-serif;">
    <span style="cursor:pointer;" onclick="changeLang('ru')">🇷🇺 RU</span> | 
    <span style="cursor:pointer;" onclick="changeLang('en')">🇬🇧 EN</span> | 
    <span style="cursor:pointer;" onclick="changeLang('es')">🇪🇸 ES</span>
  </p>

  <p align="center" style="font-size: 11px; color: #bcaada; font-family: sans-serif;">
    <em>Kpblm4ik & boonie144 — 2026 ©</em>
  </p>

  <script>
  function changeLang(langCode) {
    const languages = ['ru', 'en', 'es'];
    languages.forEach(lang => {
      const elements = document.querySelectorAll(`[lang="${lang}"]`);
      elements.forEach(el => {
        if (lang === langCode) el.style.setProperty('display', 'block', 'important');
        else el.style.setProperty('display', 'none', 'important');
      });
    });
    localStorage.setItem('wiki_language', langCode);
  }
  document.addEventListener("DOMContentLoaded", function() {
    const savedLang = localStorage.getItem('wiki_language') || 'ru';
    changeLang(savedLang);
  });
  </script>

</body>
</html>
