<!DOCTYPE html>
<html lang="{{ page.lang | default: 'ru' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: 'a51bfcts Вики' }}</title>
    <style>
        html, body {
            margin: 0;
            padding: 10px;
            min-height: 100vh;
            font-family: sans-serif;
            background-color: #050407 !important;
            color: #e2daf0 !important;
        }

        /* Твой крутой зафиксированный фон с идеальными настройками яркости */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-image: url('{{ site.baseurl }}/Screenshot_20261006_110338.jpg');
            background-size: cover;
            background-position: center top;
            filter: brightness(0.24) contrast(1.4) saturate(1.3) !important;
            z-index: -2;
            pointer-events: none;
        }

        .wrapper {
            max-width: 600px;
            margin: 0 auto;
            background-color: #0b090f !important;
            box-shadow: 0 0 40px rgba(138, 43, 226, 0.4), 0 0 10px rgba(138, 43, 226, 0.2) !important;
            border-radius: 8px;
            padding: 20px;
            position: relative;
            z-index: 1;
            box-sizing: border-box;
        }

        a {
            color: #a066ff !important;
            text-shadow: 0 0 5px rgba(160, 102, 255, 0.3);
            text-decoration: none;
        }

        img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 10px auto;
            border-radius: 12px;
        }

        footer {
            margin-top: 40px;
            text-align: center;
            font-size: 14px;
            color: #8c829e !important;
            border-top: 1px solid rgba(160, 102, 255, 0.1);
            padding-top: 15px;
        }
        footer p { margin: 5px 0; color: #8c829e !important; }
    </style>

    <!-- Подключение микростилей страниц -->
    {% if page.custom_css %}
    <link rel="stylesheet" href="{{ page.custom_css | relative_url }}">
    {% endif %}
</head>
<body>
    <div class="wrapper">
        {{ content }}
                <footer>
  <img src="{{ site.baseurl }}/1000033782.png" alt="Area 51 But Find Coils To Survive">
  <p>kpblm4ik 2026 ©</p>
  <p>Защищено лицензией CC-BY-NC-ND 4.0</p>
                </footer>
    </div>
    <!-- Кнопка вызова лупы -->
<button id="magnifier-toggle-btn" title="Включить лупу">🔍</button>

<!-- Окно лупы (сверхлегкая версия) -->
<div id="screen-magnifier">
  <div id="magnifier-drag-handle">:: Лупа ::</div>
  <div id="magnifier-viewer">
    <!-- Контейнер-зеркало страницы -->
    <div id="magnifier-mirror"></div>
  </div>
  <div id="magnifier-resize-handle"></div>
</div>

<style>
  #magnifier-toggle-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background-color: #0b090f;
    border: 2px solid #a066ff;
    color: #fff;
    font-size: 22px;
    cursor: pointer;
    z-index: 99999;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 15px rgba(160, 102, 255, 0.6);
    transition: transform 0.2s ease, background-color 0.2s ease;
    touch-action: none;
  }
  #magnifier-toggle-btn.active {
    background-color: #a066ff;
    color: #0b090f;
    box-shadow: 0 0 25px #a066ff;
  }

  #screen-magnifier {
    display: none;
    position: fixed;
    width: 220px;
    height: 220px;
    min-width: 120px;
    min-height: 120px;
    background-color: #050407;
    border: 2px solid #a066ff;
    box-shadow: 0 0 35px rgba(138, 43, 226, 0.6);
    border-radius: 8px;
    z-index: 99998;
    box-sizing: border-box;
    overflow: hidden;
    flex-direction: column;
    will-change: transform, left, top, width, height; /* Включает ускорение видеокарты */
  }

  #magnifier-drag-handle {
    background: #0b090f;
    border-bottom: 1px solid rgba(160, 102, 255, 0.4);
    color: #bcaada;
    font-size: 11px;
    text-align: center;
    padding: 5px 0;
    cursor: move;
    user-select: none;
    touch-action: none;
  }

  #magnifier-viewer {
    flex: 1;
    position: relative;
    overflow: hidden;
  }

  /* Вместо копирования кода используем CSS-изоляцию */
  #magnifier-mirror {
    position: absolute;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    transform-origin: top left;
    transform: scale(2); /* Кратность увеличения (x2) */
    pointer-events: none;
  }

  #magnifier-resize-handle {
    position: absolute;
    right: 0;
    bottom: 0;
    width: 18px;
    height: 18px;
    cursor: se-resize;
    background: linear-gradient(135deg, transparent 50%, #a066ff 50%);
    touch-action: none;
  }
</style>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const toggleBtn = document.getElementById("magnifier-toggle-btn");
  const magnifier = document.getElementById("screen-magnifier");
  const dragHandle = document.getElementById("magnifier-drag-handle");
  const resizeHandle = document.getElementById("magnifier-resize-handle");
  const mirror = document.getElementById("magnifier-mirror");

  const ZOOM_SCALE = 2;
  let isContentInitialized = false;

  let magState = {
    visible: false,
    x: window.innerWidth / 2 - 110,
    y: window.innerHeight / 2 - 110,
    w: 220,
    h: 220
  };

  // Инициализируем контент ЕДИНОЖДЫ при открытии, а не при каждом движении
  function initMagnifierContent() {
    // Клонируем только обертку с контентом сайта, игнорируя системные элементы скрипта
    const wrapper = document.querySelector(".wrapper");
    if (wrapper) {
      mirror.innerHTML = wrapper.outerHTML;
      isContentInitialized = true;
    }
  }

  function updateMirrorPosition() {
    if (!magState.visible) return;
    const viewerRect = document.getElementById("magnifier-viewer").getBoundingClientRect();
    
    // Плавный сдвиг с помощью аппаратного ускорения CSS (transformTranslate)
    // Избавляет от микрофризов скролла
    const scrollX = window.scrollX || window.pageXOffset;
    const scrollY = window.scrollY || window.pageYOffset;
    
    // Синхронизируем положение "подложки" внутри лупы
    mirror.style.transform = `scale(${ZOOM_SCALE}) translate(${-viewerRect.left / ZOOM_SCALE}px, ${-viewerRect.top / ZOOM_SCALE}px)`;
  }

  function applyState() {
    magnifier.style.left = `${magState.x}px`;
    magnifier.style.top = `${magState.y}px`;
    magnifier.style.width = `${magState.w}px`;
    magnifier.style.height = `${magState.h}px`;
    
    if (magState.visible) {
      magnifier.style.display = "flex";
      toggleBtn.classList.add("active");
      if (!isContentInitialized) initMagnifierContent();
      // Используем requestAnimationFrame для синхронизации с частотой обновления экрана
      requestAnimationFrame(updateMirrorPosition);
    } else {
      magnifier.style.display = "none";
      toggleBtn.classList.remove("active");
    }
  }

  // Оптимизированный слушатель скролла
  window.addEventListener("scroll", () => {
    if (magState.visible) requestAnimationFrame(updateMirrorPosition);
  }, { passive: true });

  toggleBtn.addEventListener("click", () => {
    magState.visible = !magState.visible;
    applyState();
  });

  // Логика перемещения и изменения размеров (универсальная для мыши и тача)
  let activeAction = null; // 'drag', 'resize' или null
  let startPointerX, startPointerY;
  let startX, startY, startW, startH;

  function startAction(type, clientX, clientY, e) {
    activeAction = type;
    startPointerX = clientX;
    startPointerY = clientY;
    startX = magState.x;
    startY = magState.y;
    startW = magState.w;
    startH = magState.h;
    document.body.style.userSelect = "none";
  }

  dragHandle.addEventListener("mousedown", (e) => startAction('drag', e.clientX, e.clientY));
  dragHandle.addEventListener("touchstart", (e) => startAction('drag', e.touches[0].clientX, e.touches[0].clientY));

  resizeHandle.addEventListener("mousedown", (e) => startAction('resize', e.clientX, e.clientY));
  resizeHandle.addEventListener("touchstart", (e) => startAction('resize', e.touches[0].clientX, e.touches[0].clientY));

  function moveAction(clientX, clientY) {
    if (!activeAction) return;

    const deltaX = clientX - startPointerX;
    const deltaY = clientY - startPointerY;

    if (activeAction === 'drag') {
      magState.x = startX + deltaX;
      magState.y = startY + deltaY;
      magState.x = Math.max(0, Math.min(window.innerWidth - magState.w, magState.x));
      magState.y = Math.max(0, Math.min(window.innerHeight - magState.h, magState.y));
      
      magnifier.style.left = `${magState.x}px`;
      magnifier.style.top = `${magState.y}px`;
    } else if (activeAction === 'resize') {
      magState.w = Math.max(120, startW + deltaX);
      magState.h = Math.max(120, startH + deltaY);
      
      magnifier.style.width = `${magState.w}px`;
      magnifier.style.height = `${magState.h}px`;
    }

    requestAnimationFrame(updateMirrorPosition);
  }

  window.addEventListener("mousemove", (e) => moveAction(e.clientX, e.clientY));
  window.addEventListener("touchmove", (e) => {
    if (activeAction) {
      moveAction(e.touches[0].clientX, e.touches[0].clientY);
    }
  }, { passive: true });

  const endAction = () => {
    activeAction = null;
    document.body.style.userSelect = "";
  };

  window.addEventListener("mouseup", endAction);
  window.addEventListener("touchend", endAction);
});
</script>
</body>
</html>
