<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>{{ page.title | default: "Вики a51bfcts" }}</title>
  
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Rubik+Mono+One&family=Rubik:wght@900&display=swap" rel="stylesheet">

  <style>
    /* Убираем любые системные отступы */
    html, body { 
      background-color: #050407 !important; color: #e2daf0 !important; 
      margin: 0 !important; padding: 0 !important; font-family: sans-serif;
      min-height: 100%;
    }
    
    /* Наш компактный неоновый блок по центру экрана */
    .wiki-content-box {
      position: relative; background-color: #0b090f !important;
      box-shadow: 0 0 40px rgba(138, 43, 226, 0.4), 0 0 10px rgba(138, 43, 226, 0.2) !important;
      border-radius: 8px; padding: 20px !important; z-index: 1; overflow: hidden;
      margin: 20px auto !important; max-width: 480px !important; box-sizing: border-box;
    }
    
    /* Приближенный неоновый логотип на заднем плане */
    .wiki-content-box::before {
      content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-image: url('Screenshot_20261006_110338.jpg') !important;
      background-size: cover !important; background-position: center top !important;
      filter: brightness(0.24) contrast(1.4) saturate(1.3) !important; z-index: -1; opacity: 0.9;
    }
    
    a { color: #a066ff !important; text-shadow: 0 0 5px rgba(160, 102, 255, 0.3); text-decoration: none; }
    img { max-width: 100% !important; height: auto !important; border-radius: 6px; display: block; margin: 10px auto; }
    [lang="en"], [lang="es"] { display: none; }

    /* ДИЗАЙН СЕТКИ ДЛЯ КАТАЛОГОВ (2 В РЯД) */
    .items-grid { display: flex; flex-wrap: wrap; gap: 15px; margin-top: 20px; }
    .item-card {
      flex: 1 1 calc(50% - 8px); min-width: 140px; background-color: rgba(20, 16, 28, 0.7);
      border: 1px solid rgba(160, 102, 255, 0.3); border-radius: 6px; padding: 10px; box-sizing: border-box;
      text-align: center; display: flex; flex-direction: column; align-items: center;
      transition: transform 0.2s, box-shadow 0.2s; cursor: pointer;
    }
    .item-card:hover { transform: scale(1.03); box-shadow: 0 0 15px rgba(160, 102, 255, 0.6); border-color: #a066ff; }
    .item-card img { width: 100%; height: auto; border-radius: 4px; margin-bottom: 8px; }
    .item-card h3 { margin: 5px 0; color: #fff; font-size: 16px; }
    .item-card p { margin: 2px 0; font-size: 13px; color: #bcaada; }

    /* ТАБЛИЦЫ ХАРАКТЕРИСТИК */
    ul { list-style: none; padding: 0; }
    li { margin: 8px 0; }
    h1 { font-family: 'Rubik Mono One', sans-serif; font-size: 20px; color: #fff; text-shadow: 0 0 10px #a066ff; text-align: center; }
    blockquote { background-color: rgba(138, 43, 226, 0.1); border-left: 3px solid #a066ff; padding: 10px; margin: 15px 0; border-radius: 4px; }
  </style>
</head>
<body>

  <!-- СЮДА ПРИЛЕТИТ НАШ ЧИСТЫЙ МАРКДАУН -->
  <div class="wiki-content-box">
    {{ content }}
  </div>

  <!-- КНОПКИ ПЕРЕКЛЮЧЕНИЯ ЯЗЫКОВ -->
  <p align="center" style="font-size: 18px; margin-top: 30px;">
    <span style="cursor:pointer;" onclick="changeLang('ru')">🇷🇺 RU</span> | 
    <span style="cursor:pointer;" onclick="changeLang('en')">🇬🇧 EN</span> | 
    <span style="cursor:pointer;" onclick="changeLang('es')">🇪🇸 ES</span>
  </p>

  <p align="center" style="font-size: 11px; color: #bcaada;">
    <em>Kpblm4ik & boonie144 — 2026 ©</em>
  </p>

  <script>
  function changeLang(langCode) {
    const languages = ['ru', 'en', 'es'];
    languages.forEach(lang => {
      const elements = document.querySelectorAll(`[lang="${lang}"]`);
      elements.forEach(el => {
        if (lang === langCode) el.style.setProperty('display', 'block', 'important');
        else el.style.setProperty('display', 'none', 'important');
      });
    });
    localStorage.setItem('wiki_language', langCode);
  }
  document.addEventListener("DOMContentLoaded", function() {
    const savedLang = localStorage.getItem('wiki_language') || 'ru';
    changeLang(savedLang);
  });
  </script>

</body>
</html>
