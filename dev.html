<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Для разработчиков — a51bfcts</title>
<style>
:root{--bg:#0b0813;--card:#1b1625;--ac:#9b5cff;--tx:#fff;--mut:#b9a6ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid #2d2450}
header a{color:var(--mut);text-decoration:none}
#login{max-width:360px;margin:20vh auto;padding:20px;text-align:center}
input{width:100%;padding:13px;border-radius:12px;border:1px solid #4a3a8a;background:#0e0b16;color:#fff;font:inherit;margin:8px 0}
button{padding:12px 18px;border:0;border-radius:999px;background:var(--ac);color:#fff;font:inherit}
#err{color:#ff7a8a;min-height:1.2em}
nav{display:flex;gap:8px;overflow-x:auto;padding:12px 16px}nav button{background:var(--card);white-space:nowrap}nav button.on{background:var(--ac)}
main{padding:0 16px 40px}.item{background:var(--card);border-radius:14px;padding:14px;margin:10px 0;font-size:14px}
.item small{color:var(--mut)}.item b{color:var(--mut)}iframe{width:100%;height:80vh;border:0;border-radius:14px;background:#fff}
</style></head><body>
<header><b>&gt;_ Для разработчиков</b><a href="./">← На сайт</a></header>
<div id="login"><h2>Введите токен</h2><input id="tk" type="password" placeholder="Токен" autocomplete="off">
<button onclick="login()">Войти</button><p id="err"></p></div>
<div id="app" hidden>
<nav id="tabs"><button data-t="page" class="on">Создать страницу</button><button data-t="logs">Логи</button><button data-t="ad">Реклама</button><button data-t="job">Работа</button><button onclick="logout()">Выйти</button></nav>
<main id="view"></main></div>
<script>
const REPO='kpblm4ik/a51bfcts_wikipedia',API='https://api.github.com/repos/'+REPO;
const $=s=>document.querySelector(s);
const gh=(p,t=T)=>fetch(API+p,{headers:{Authorization:'Bearer '+t,Accept:'application/vnd.github+json'}}).then(r=>r.ok?r.json():Promise.reject(r.status));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let T=localStorage.getItem('a51tk')||'';
async function login(){
  const t=$('#tk').value.trim()||T;
  try{ const r=await gh('',t); if(r.permissions&&r.permissions.push){ T=t; localStorage.setItem('a51tk',t); start(); return; } }catch{}
  localStorage.removeItem('a51tk'); T=''; $('#err').textContent='Неверный токен или нет прав на репозиторий';
}
function logout(){localStorage.removeItem('a51tk');location.reload()}
function start(){$('#login').hidden=true;$('#app').hidden=false;show('page')}
async function show(t){
  document.querySelectorAll('#tabs [data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  const v=$('#view');
  if(t==='page'){ v.innerHTML='<iframe src="new-page.html"></iframe>'; return; }
  v.innerHTML='<p>Загрузка…</p>';
  try{
    if(t==='logs'){
      const c=await gh('/commits?per_page=50');
      v.innerHTML=c.map(x=>`<div class="item"><small>${new Date(x.commit.author.date).toLocaleString('ru')} · ${esc(x.commit.author.name)}</small><br>${esc(x.commit.message)}</div>`).join('')||'<p>Пусто</p>';
    }else{
      const i=(await gh('/issues?state=all&per_page=50&labels='+t)).filter(x=>!x.pull_request);
      v.innerHTML=i.map(x=>`<div class="item"><small>${new Date(x.created_at).toLocaleString('ru')} · <a style="color:#b9a6ff" href="${x.html_url}" target="_blank" rel="noopener">#${x.number}</a></small><br>${esc(x.body||'').replace(/\n/g,'<br>')}</div>`).join('')||'<p>Пусто</p>';
    }
  }catch(e){v.innerHTML='<p>Ошибка загрузки: '+esc(e)+'</p>'}
}
$('#tabs').onclick=e=>{const b=e.target.dataset.t;if(b)show(b)};
$('#tk').onkeydown=e=>e.key==='Enter'&&login();
if(T)login();
</script></body></html>
